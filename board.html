<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#ED0006">
  <title>支部内掲示板・お手伝い募集・アンケート | 龍翔会</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body {
      margin: 0; padding: 0; width: 100%; max-width: 100vw; overflow-x: hidden;
      background: #F8F8F8; color: #111;
      font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "palt";
      letter-spacing: -0.01em;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 12px 8px 48px; }
    @media (min-width: 640px) { .wrap { padding: 16px 24px 64px; } }

    header.bar { background: #fff; border: 1px solid #E5E5E5; padding: 10px; margin-bottom: 10px; min-width: 0; overflow: hidden; }
    .bar-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .logo { width: 32px; height: 32px; flex-shrink: 0; background: #ED0006; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; line-height: 1; font-size: 8px; letter-spacing: -0.05em; }
    .sub-label { font-size: 9px; font-weight: 900; color: #ED0006; letter-spacing: .12em; }
    h1 { margin: 2px 0 0; font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (min-width: 640px) {
      header.bar { padding: 12px 16px; }
      .logo { width: 40px; height: 40px; font-size: 10px; }
      h1 { font-size: 18px; }
    }
    .links { display: flex; gap: 6px; flex-shrink: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 32px; padding: 0 12px;
      font: inherit; font-size: 12px; font-weight: 900; text-decoration: none; cursor: pointer; white-space: nowrap;
      border: 1px solid #E5E5E5; background: #fff; color: #111; flex-shrink: 0;
    }
    .btn:hover { background: #F5F5F5; }
    .btn.black { background: #111; color: #fff; border-color: #111; }
    .btn.black:hover { background: #222; }
    .btn.red { background: #ED0006; color: #fff; border-color: #ED0006; }
    .btn.red:hover { background: #D60005; }
    .btn.sm { height: 26px; padding: 0 8px; font-size: 11px; }
    .btn.danger { color: #ED0006; border-color: #F3C0C0; }
    .btn.danger:hover { background: #FFF1F1; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .tabs { display: flex; border: 2px solid #111; background: #fff; margin-bottom: 10px; }
    .tab { flex: 1; padding: 10px 4px; font: inherit; font-size: 13px; font-weight: 900; background: #fff; border: 0; cursor: pointer; color: #111; }
    .tab + .tab { border-left: 2px solid #111; }
    .tab.active { background: #111; color: #fff; }
    .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; font-size: 10px; line-height: 16px; background: #ED0006; color: #fff; }

    .status { font-size: 11px; font-weight: 700; color: #767676; margin: 0 0 8px; min-height: 16px; }
    .status.err { color: #ED0006; white-space: pre-wrap; }

    .name-row { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-bottom: 10px; flex-wrap: wrap; }
    .name-row input { height: 30px; border: 1px solid #E5E5E5; background: #fff; padding: 0 8px; font: inherit; font-size: 13px; font-weight: 700; width: 160px; max-width: 100%; }

    .card { background: #fff; border: 1px solid #E5E5E5; padding: 12px; margin-bottom: 8px; }
    .card.form { border: 2px solid #111; }
    .card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 900; }
    label.f { display: block; font-size: 11px; font-weight: 900; margin: 8px 0 3px; color: #111; }
    .card input[type=text], .card input[type=number], .card select, .card textarea {
      width: 100%; border: 1px solid #CCC; background: #fff; padding: 7px 8px; font: inherit; font-size: 14px; border-radius: 0;
    }
    .card textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
    .card input:focus, .card select:focus, .card textarea:focus { outline: none; border-color: #111; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
    .actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
    .hint { font-size: 10px; color: #767676; font-weight: 500; margin-top: 3px; }

    .post-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .post-name { font-size: 12px; font-weight: 900; }
    .post-date { font-size: 10px; color: #767676; font-weight: 500; white-space: nowrap; }
    .post-title { font-size: 14px; font-weight: 900; margin: 2px 0 4px; word-break: break-word; }
    .post-body { font-size: 13px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
    .post-body a { color: #ED0006; font-weight: 700; }
    .post-foot { display: flex; justify-content: flex-end; margin-top: 8px; }

    .h-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .h-title { font-size: 14px; font-weight: 900; word-break: break-word; }
    .h-meta { font-size: 11px; color: #555; font-weight: 700; margin-top: 2px; }
    .tag { display: inline-block; font-size: 10px; font-weight: 900; padding: 1px 7px; white-space: nowrap; flex-shrink: 0; }
    .tag.open { background: #ED0006; color: #fff; }
    .tag.full { background: #111; color: #fff; }
    .tag.closed { background: #E5E5E5; color: #555; }
    .bar-wrap { height: 6px; background: #EEE; margin: 8px 0 4px; }
    .bar-fill { height: 100%; background: #ED0006; }
    .bar-fill.done { background: #111; }
    .count { font-size: 12px; font-weight: 900; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; background: #F5F5F5; border: 1px solid #E5E5E5; }
    .chip.me { background: #FFF1F1; border-color: #ED0006; color: #ED0006; }
    .closed-card { opacity: .7; }

    .empty { padding: 28px 12px; text-align: center; font-size: 13px; font-weight: 700; color: #767676; background: #fff; border: 1px solid #E5E5E5; }
    #gate { display: none; max-width: 420px; margin: 40px auto; background: #fff; border: 2px solid #111; padding: 24px; text-align: center; }
    #gate p { font-size: 13px; font-weight: 700; line-height: 1.7; margin: 0 0 16px; }
    .join-row { display: flex; gap: 6px; align-items: center; flex: 1; justify-content: flex-end; min-width: 0; flex-wrap: wrap; }
    .join-row input[type=text] { height: 26px; width: 140px; max-width: 100%; border: 1px solid #CCC; padding: 0 8px; font: inherit; font-size: 13px; font-weight: 700; border-radius: 0; }
    .join-row input[type=text]:focus { outline: none; border-color: #111; }

    .opt { display: flex; align-items: center; gap: 8px; padding: 9px 10px; margin-top: 6px; border: 1px solid #CCC; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
    .opt:hover { background: #FAFAFA; }
    .opt.on { border-color: #111; background: #F5F5F5; }
    .opt input { margin: 0; width: 18px; height: 18px; accent-color: #ED0006; flex-shrink: 0; }
    .res { margin-top: 8px; }
    .res-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; word-break: break-word; }
    .res-top b { font-weight: 900; white-space: nowrap; }
    .res .bar-wrap { margin: 3px 0 0; height: 10px; }
    .res.top .bar-fill { background: #ED0006; }
    .res:not(.top) .bar-fill { background: #999; }
    .anon { display: inline-block; font-size: 10px; font-weight: 900; padding: 1px 7px; background: #111; color: #fff; margin-left: 6px; vertical-align: middle; }
    .check-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; font-weight: 700; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <div class="bar-top">
        <div class="brand">
          <div class="logo"><span>龍翔</span><span>会</span></div>
          <div style="min-width:0">
            <div class="sub-label">RYUSYOKAI BOARD</div>
            <h1>支部内掲示板・お手伝い募集</h1>
          </div>
        </div>
        <div class="links">
          <a class="btn" href="index.html">← 管理表へ</a>
        </div>
      </div>
    </header>

    <p class="status" id="status">読み込み中…</p>

    <div id="gate">
      <p>掲示板を見るにはログインが必要です。<br>管理表のページでログインしてから、もう一度開いてください。</p>
      <a class="btn black" href="index.html">管理表でログイン</a>
    </div>

    <div id="app" class="hidden">
      <div class="name-row">
        <span>投稿に表示する名前：</span>
        <input type="text" id="displayName" maxlength="30" placeholder="例）鈴木" autocomplete="nickname">
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tabBoard" role="tab" onclick="showTab('board')">掲示板</button>
        <button class="tab" id="tabHelp" role="tab" onclick="showTab('help')">お手伝い募集<span class="badge hidden" id="openBadge">0</span></button>
        <button class="tab" id="tabPoll" role="tab" onclick="showTab('poll')">アンケート<span class="badge hidden" id="pollBadge">0</span></button>
      </div>

      <!-- ===== 掲示板 ===== -->
      <section id="paneBoard">
        <div class="card form">
          <h2>＋ 新しい投稿</h2>
          <label class="f" for="postTitle">件名（任意）</label>
          <input type="text" id="postTitle" maxlength="60" placeholder="例）次回の練習日について">
          <label class="f" for="postBody">内容</label>
          <textarea id="postBody" maxlength="1000" placeholder="支部のみなさんへのお知らせ・連絡など"></textarea>
          <div class="actions">
            <button class="btn red" id="postBtn" onclick="submitPost()">投稿する</button>
          </div>
        </div>
        <div id="postList"></div>
      </section>

      <!-- ===== お手伝い募集 ===== -->
      <section id="paneHelp" class="hidden">
        <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
          <button class="btn red" id="toggleHelpForm" onclick="toggleHelpForm()">＋ 募集を作る</button>
        </div>

        <div class="card form hidden" id="helpForm">
          <h2>お手伝いを募集する</h2>
          <label class="f" for="hTitle">タイトル</label>
          <input type="text" id="hTitle" maxlength="60" placeholder="例）11/16 秋季大会の運営お手伝い">
          <div class="row2">
            <div>
              <label class="f" for="hDate">日程（任意）</label>
              <input type="text" id="hDate" maxlength="40" placeholder="例）11/16(日)">
            </div>
            <div>
              <label class="f" for="hNeed">必要人数</label>
              <input type="number" id="hNeed" min="1" max="99" value="3" inputmode="numeric">
            </div>
          </div>
          <label class="f" for="hRole">お手伝いの内容（任意）</label>
          <input type="text" id="hRole" maxlength="60" placeholder="例）受付・記録・的場係">
          <label class="f" for="hNote">集合時間・場所・備考（任意）</label>
          <textarea id="hNote" maxlength="500" placeholder="例）8:00 会場集合／昼食は各自"></textarea>
          <div class="actions">
            <button class="btn" onclick="toggleHelpForm()">キャンセル</button>
            <button class="btn red" id="helpBtn" onclick="submitHelp()">募集する</button>
          </div>
        </div>

        <div id="helpList"></div>
      </section>

      <!-- ===== アンケート（匿名） ===== -->
      <section id="panePoll" class="hidden">
        <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
          <button class="btn red" id="togglePollForm" onclick="togglePollForm()">＋ アンケートを作る</button>
        </div>

        <div class="card form hidden" id="pollForm">
          <h2>アンケートを作る（匿名回答）</h2>
          <label class="f" for="pTitle">質問・タイトル</label>
          <input type="text" id="pTitle" maxlength="80" placeholder="例）忘年会の日程はどれがいいですか？">
          <label class="f" for="pDesc">補足（任意）</label>
          <textarea id="pDesc" maxlength="300" style="min-height:56px" placeholder="例）場所は後日お知らせします"></textarea>
          <label class="f" for="pOptions">選択肢（1行に1つ・2〜8個）</label>
          <textarea id="pOptions" maxlength="500" placeholder="12/6(土)&#10;12/13(土)&#10;12/20(土)"></textarea>
          <label class="check-row"><input type="checkbox" id="pMulti"> 複数選べるようにする</label>
          <div class="hint">誰がどれを選んだかは記録・表示されません。回答は1人1回で、送信後の変更はできません。</div>
          <div class="actions">
            <button class="btn" onclick="togglePollForm()">キャンセル</button>
            <button class="btn red" id="pollBtn" onclick="submitPoll()">作成する</button>
          </div>
        </div>

        <div id="pollList"></div>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
    import { getFirestore, doc, collection, addDoc, updateDoc, deleteDoc,
             query, orderBy, limit, onSnapshot, serverTimestamp, arrayUnion, arrayRemove, increment }
      from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDo_CYLFEjFsSAeXpGzZ_h9hHno7YQacDI",
      authDomain: "ryusyokai-27030.firebaseapp.com",
      projectId: "ryusyokai-27030",
      storageBucket: "ryusyokai-27030.firebasestorage.app",
      messagingSenderId: "508882166129",
      appId: "1:508882166129:web:e4a0d4604701c70a1016d0",
      measurementId: "G-3V0KZKXY8S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const POSTS = 'board_posts';
    const HELPS = 'helper_calls';
    const POLLS = 'polls';
    const NAME_KEY = 'board_display_name';

    const $ = (id) => document.getElementById(id);
    let me = null;
    let unsubs = [];
    let posts = [];
    let helps = [];
    let polls = [];
    const joinDrafts = {};   // 募集ID -> 入力途中の名前
    const pollSel = {};      // アンケートID -> 選択中のインデックス配列
    const peek = {};         // アンケートID -> 回答せず結果だけ見る
    let helpDeferred = false;

    // ---------- ユーティリティ ----------
    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    // エスケープ済みの本文に、http(s)のURLだけリンクを付ける
    function linkify(escaped) {
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, (u) =>
        `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
    }
    function fmtDate(ts) {
      if (!ts || typeof ts.toDate !== 'function') return '送信中…';
      const d = ts.toDate();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function setStatus(text, isErr) {
      const el = $('status');
      el.textContent = text || '';
      el.className = 'status' + (isErr ? ' err' : '');
    }
    function errText(e) {
      if (e && e.code === 'permission-denied') {
        return '保存・読み込みが許可されていません。\nFirestoreのルールに board_posts / helper_calls / polls の設定が必要です（管理者向け）。';
      }
      return '処理に失敗しました。通信状況を確認してもう一度お試しください。';
    }
    function myName() {
      const v = $('displayName').value.trim();
      return v;
    }
    function needName() {
      const n = myName();
      if (!n) {
        alert('先に「投稿に表示する名前」を入力してください。');
        $('displayName').focus();
        return null;
      }
      try { localStorage.setItem(NAME_KEY, n); } catch (e) { /* ignore */ }
      return n;
    }

    // ---------- タブ ----------
    window.showTab = (name) => {
      ['board', 'help', 'poll'].forEach(t => {
        const on = t === name;
        $('pane' + t[0].toUpperCase() + t.slice(1)).classList.toggle('hidden', !on);
        $('tab' + t[0].toUpperCase() + t.slice(1)).classList.toggle('active', on);
      });
      try { history.replaceState(null, '', name === 'board' ? location.pathname : '#' + name); } catch (e) { /* ignore */ }
    };

    // ---------- 掲示板 ----------
    function renderPosts() {
      const box = $('postList');
      if (!posts.length) {
        box.innerHTML = '<div class="empty">まだ投稿がありません。最初の投稿をどうぞ。</div>';
        return;
      }
      box.innerHTML = posts.map(p => {
        const mine = me && p.uid === me.uid;
        return `<div class="card">
          <div class="post-head">
            <span class="post-name">${esc(p.name)}</span>
            <span class="post-date">${fmtDate(p.createdAt)}</span>
          </div>
          ${p.title ? `<div class="post-title">${esc(p.title)}</div>` : ''}
          <div class="post-body">${linkify(esc(p.body))}</div>
          ${mine ? `<div class="post-foot"><button class="btn sm danger" onclick="deletePost('${esc(p.id)}')">削除</button></div>` : ''}
        </div>`;
      }).join('');
    }

    window.submitPost = async () => {
      const name = needName(); if (!name) return;
      const body = $('postBody').value.trim();
      const title = $('postTitle').value.trim();
      if (!body) { alert('内容を入力してください。'); return; }
      $('postBtn').disabled = true;
      try {
        await addDoc(collection(db, POSTS), {
          uid: me.uid, name: name.slice(0, 30),
          title: title.slice(0, 60), body: body.slice(0, 1000),
          createdAt: serverTimestamp()
        });
        $('postBody').value = ''; $('postTitle').value = '';
        setStatus('');
      } catch (e) { console.error(e); setStatus(errText(e), true); }
      $('postBtn').disabled = false;
    };

    window.deletePost = async (id) => {
      if (!confirm('この投稿を削除しますか？')) return;
      try { await deleteDoc(doc(db, POSTS, id)); }
      catch (e) { console.error(e); setStatus(errText(e), true); }
    };

    // ---------- お手伝い募集 ----------
    function isOpen(h) { return !h.closed && (h.volunteers || []).length < h.need; }

    function savedName() {
      const v = $('displayName').value.trim();
      if (v) return v;
      try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
    }
    window.setJoinDraft = (id, v) => { joinDrafts[id] = v; };

    function renderHelps() {
      // 名前を入力している最中は、他の人の更新で入力欄が作り直されないよう描画を後回しにする
      const ae = document.activeElement;
      if (ae && ae.tagName === 'INPUT' && $('helpList').contains(ae)) { helpDeferred = true; return; }
      helpDeferred = false;
      const openCount = helps.filter(isOpen).length;
      const badge = $('openBadge');
      badge.textContent = openCount;
      badge.classList.toggle('hidden', openCount === 0);

      const box = $('helpList');
      if (!helps.length) {
        box.innerHTML = '<div class="empty">いま募集中のお手伝いはありません。</div>';
        return;
      }
      // 募集中を上に、その後に充足・締切
      const sorted = helps.slice().sort((a, b) => (isOpen(b) ? 1 : 0) - (isOpen(a) ? 1 : 0));
      box.innerHTML = sorted.map(h => {
        const vols = h.volunteers || [];
        const n = vols.length;
        const iJoined = me && vols.some(v => v.uid === me.uid);
        const mine = me && h.uid === me.uid;
        const full = n >= h.need;
        const state = h.closed ? ['closed', '締切'] : (full ? ['full', '充足'] : ['open', '募集中']);
        const pct = Math.min(100, Math.round(n / Math.max(1, h.need) * 100));
        const id = esc(h.id);
        return `<div class="card${h.closed ? ' closed-card' : ''}">
          <div class="h-top">
            <div style="min-width:0">
              <div class="h-title">${esc(h.title || h.tournament)}</div>
              ${(h.date || h.role) ? `<div class="h-meta">${h.date ? esc(h.date) + '　' : ''}${esc(h.role || '')}</div>` : ''}
            </div>
            <span class="tag ${state[0]}">${state[1]}</span>
          </div>
          <div class="bar-wrap"><div class="bar-fill${full ? ' done' : ''}" style="width:${pct}%"></div></div>
          <div class="count">${n} / ${h.need}名</div>
          ${h.note ? `<div class="post-body" style="margin-top:6px">${linkify(esc(h.note))}</div>` : ''}
          ${n ? `<div class="chips">${vols.map(v => `<span class="chip${me && v.uid === me.uid ? ' me' : ''}">${esc(v.name)}</span>`).join('')}</div>` : ''}
          <div class="post-head" style="margin-top:8px">
            <span class="post-date">募集：${esc(h.name)}（${fmtDate(h.createdAt)}）</span>
          </div>
          <div class="actions" style="margin-top:4px">
            ${iJoined
              ? `<button class="btn sm" onclick="leaveHelp('${id}')">参加を取り消す</button>`
              : ((h.closed || full) ? '<button class="btn sm red" disabled>手伝える</button>'
                : `<div class="join-row">
                    <input type="text" maxlength="30" placeholder="あなたの名前" value="${esc(joinDrafts[h.id] !== undefined ? joinDrafts[h.id] : savedName())}"
                      oninput="setJoinDraft('${id}', this.value)" onkeydown="if(event.key==='Enter'){joinHelp('${id}')}" aria-label="参加者の名前">
                    <button class="btn sm red" onclick="joinHelp('${id}')">手伝える</button>
                  </div>`)}
            ${mine ? `<button class="btn sm" onclick="toggleClosed('${id}', ${h.closed ? 'false' : 'true'})">${h.closed ? '募集を再開' : '募集を締め切る'}</button>
                      <button class="btn sm danger" onclick="deleteHelp('${id}')">削除</button>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    window.joinHelp = async (id) => {
      const h = helps.find(x => x.id === id); if (!h) return;
      const name = (joinDrafts[id] !== undefined ? joinDrafts[id] : savedName()).trim();
      if (!name) { alert('名前を入力してください。'); return; }
      if ((h.volunteers || []).some(v => v.uid === me.uid)) return;
      try {
        await updateDoc(doc(db, HELPS, id), { volunteers: arrayUnion({ uid: me.uid, name: name.slice(0, 30) }) });
        try { localStorage.setItem(NAME_KEY, name.slice(0, 30)); } catch (e) { /* ignore */ }
        delete joinDrafts[id];
        setStatus('');
      } catch (e) { console.error(e); setStatus(errText(e), true); }
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      renderHelps();
    };

    window.leaveHelp = async (id) => {
      const h = helps.find(x => x.id === id); if (!h) return;
      const mineEntry = (h.volunteers || []).find(v => v.uid === me.uid);
      if (!mineEntry) return;
      try { await updateDoc(doc(db, HELPS, id), { volunteers: arrayRemove(mineEntry) }); }
      catch (e) { console.error(e); setStatus(errText(e), true); }
    };

    window.toggleClosed = async (id, closed) => {
      try { await updateDoc(doc(db, HELPS, id), { closed: !!closed }); }
      catch (e) { console.error(e); setStatus(errText(e), true); }
    };

    window.deleteHelp = async (id) => {
      if (!confirm('この募集を削除しますか？（参加表明も消えます）')) return;
      try { await deleteDoc(doc(db, HELPS, id)); }
      catch (e) { console.error(e); setStatus(errText(e), true); }
    };

    window.toggleHelpForm = () => {
      const f = $('helpForm');
      f.classList.toggle('hidden');
      $('toggleHelpForm').classList.toggle('hidden', !f.classList.contains('hidden'));
    };

    window.submitHelp = async () => {
      const name = needName(); if (!name) return;
      const title = $('hTitle').value.trim();
      const role = $('hRole').value.trim();
      const need = Math.max(1, Math.min(99, parseInt($('hNeed').value, 10) || 0));
      if (!title) { alert('タイトルを入力してください。'); $('hTitle').focus(); return; }
      $('helpBtn').disabled = true;
      try {
        await addDoc(collection(db, HELPS), {
          uid: me.uid, name: name.slice(0, 30),
          title: title.slice(0, 60), date: $('hDate').value.trim().slice(0, 40),
          role: role.slice(0, 60), need: need, note: $('hNote').value.trim().slice(0, 500),
          volunteers: [], closed: false, createdAt: serverTimestamp()
        });
        ['hTitle', 'hDate', 'hRole', 'hNote'].forEach(i => { $(i).value = ''; });
        $('hNeed').value = 3;
        window.toggleHelpForm();
        setStatus('');
      } catch (e) { console.error(e); setStatus(errText(e), true); }
      $('helpBtn').disabled = false;
    };

    // ---------- アンケート（匿名） ----------
    // 回答の中身（counts）と回答済みの人（voters）は別々に保存するので、
    // 「誰がどれを選んだか」はデータ上も画面上もわからない。
    function pollTotal(p) { return (p.voters || []).length; }
    function pollNeedsMe(p) { return me && !p.closed && !(p.voters || []).includes(me.uid); }

    window.togglePollSel = (id, i, multi) => {
      let cur = pollSel[id] || [];
      if (multi) cur = cur.includes(i) ? cur.filter(x => x !== i) : cur.concat(i);
      else cur = [i];
      pollSel[id] = cur;
      renderPolls();
    };
    window.peekPoll = (id) => { peek[id] = true; renderPolls(); };
    window.unpeekPoll = (id) => { delete peek[id]; renderPolls(); };

    function renderPolls() {
      const need = polls.filter(pollNeedsMe).length;
      const badge = $('pollBadge');
      badge.textContent = need;
      badge.classList.toggle('hidden', need === 0);

      const box = $('pollList');
      if (!polls.length) {
        box.innerHTML = '<div class="empty">まだアンケートがありません。</div>';
        return;
      }
      const sorted = polls.slice().sort((a, b) => (pollNeedsMe(b) ? 1 : 0) - (pollNeedsMe(a) ? 1 : 0));
      box.innerHTML = sorted.map(p => {
        const id = esc(p.id);
        const mine = me && p.uid === me.uid;
        const voted = me && (p.voters || []).includes(me.uid);
        const total = pollTotal(p);
        const opts = p.options || [];
        const showResult = voted || p.closed || peek[p.id];
        const tag = p.closed ? '<span class="tag closed">締切</span>' : (voted ? '<span class="tag full">回答済み</span>' : '<span class="tag open">回答受付中</span>');

        let body;
        if (showResult) {
          const counts = opts.map((_, i) => Number((p.counts || {})['c' + i]) || 0);
          const max = Math.max(0, ...counts);
          body = opts.map((o, i) => {
            const pct = total ? Math.round(counts[i] / total * 100) : 0;
            const top = max > 0 && counts[i] === max;
            return `<div class="res${top ? ' top' : ''}">
              <div class="res-top"><span>${esc(o)}</span><b>${counts[i]}票（${pct}%）</b></div>
              <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
            </div>`;
          }).join('') + `<div class="count" style="margin-top:8px">回答 ${total}人${p.multi ? '（複数回答可）' : ''}</div>`;
          if (!voted && !p.closed) body += `<div class="actions"><button class="btn sm" onclick="unpeekPoll('${id}')">回答する画面に戻る</button></div>`;
        } else {
          const sel = pollSel[p.id] || [];
          body = opts.map((o, i) => `<label class="opt${sel.includes(i) ? ' on' : ''}">
              <input type="${p.multi ? 'checkbox' : 'radio'}" name="poll_${id}" ${sel.includes(i) ? 'checked' : ''}
                onchange="togglePollSel('${id}', ${i}, ${!!p.multi})">
              <span>${esc(o)}</span></label>`).join('') +
            `<div class="hint">${p.multi ? '複数選べます。' : ''}送信後の変更はできません。誰がどれを選んだかは記録されません。</div>
             <div class="actions">
               <button class="btn sm" onclick="peekPoll('${id}')">回答せず結果を見る</button>
               <button class="btn sm red" onclick="votePoll('${id}')">匿名で回答する</button>
             </div>`;
        }

        return `<div class="card${p.closed ? ' closed-card' : ''}">
          <div class="h-top">
            <div style="min-width:0">
              <div class="h-title">${esc(p.title)}<span class="anon">匿名</span></div>
              ${p.desc ? `<div class="post-body" style="margin-top:4px">${linkify(esc(p.desc))}</div>` : ''}
            </div>
            ${tag}
          </div>
          <div style="margin-top:6px">${body}</div>
          <div class="post-head" style="margin-top:8px">
            <span class="post-date">作成：${esc(p.name)}（${fmtDate(p.createdAt)}）</span>
          </div>
          ${mine ? `<div class="actions" style="margin-top:4px">
            <button class="btn sm" onclick="togglePollClosed('${id}', ${p.closed ? 'false' : 'true'})">${p.closed ? '回答を再開' : '回答を締め切る'}</button>
            <button class="btn sm danger" onclick="deletePoll('${id}')">削除</button></div>` : ''}
        </div>`;
      }).join('');
    }

    window.votePoll = async (id) => {
      const p = polls.find(x => x.id === id); if (!p) return;
      if ((p.voters || []).includes(me.uid) || p.closed) return;
      const sel = (pollSel[id] || []).filter(i => i >= 0 && i < (p.options || []).length);
      if (!sel.length) { alert('選択肢を選んでください。'); return; }
      if (!p.multi && sel.length !== 1) { alert('選択肢を1つ選んでください。'); return; }
      const upd = { voters: arrayUnion(me.uid) };
      sel.forEach(i => { upd['counts.c' + i] = increment(1); });
      try {
        await updateDoc(doc(db, POLLS, id), upd);
        delete pollSel[id]; delete peek[id];
        setStatus('');
      } catch (e) { console.error(e); setStatus(errText(e), true); }
    };

    window.togglePollClosed = async (id, closed) => {
      try { await updateDoc(doc(db, POLLS, id), { closed: !!closed }); }
      catch (e) { console.error(e); setStatus(errText(e), true); }
    };

    window.deletePoll = async (id) => {
      if (!confirm('このアンケートを削除しますか？（集計結果も消えます）')) return;
      try { await deleteDoc(doc(db, POLLS, id)); }
      catch (e) { console.error(e); setStatus(errText(e), true); }
    };

    window.togglePollForm = () => {
      const f = $('pollForm');
      f.classList.toggle('hidden');
      $('togglePollForm').classList.toggle('hidden', !f.classList.contains('hidden'));
    };

    window.submitPoll = async () => {
      const name = needName(); if (!name) return;
      const title = $('pTitle').value.trim();
      if (!title) { alert('質問・タイトルを入力してください。'); $('pTitle').focus(); return; }
      const options = [];
      $('pOptions').value.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => {
        const v = x.slice(0, 40);
        if (!options.includes(v)) options.push(v);
      });
      if (options.length < 2) { alert('選択肢を2つ以上入力してください（1行に1つ）。'); return; }
      if (options.length > 8) { alert('選択肢は8個までです。'); return; }
      const counts = {};
      options.forEach((_, i) => { counts['c' + i] = 0; });
      $('pollBtn').disabled = true;
      try {
        await addDoc(collection(db, POLLS), {
          uid: me.uid, name: name.slice(0, 30),
          title: title.slice(0, 80), desc: $('pDesc').value.trim().slice(0, 300),
          options: options, multi: $('pMulti').checked,
          counts: counts, voters: [], closed: false, createdAt: serverTimestamp()
        });
        ['pTitle', 'pDesc', 'pOptions'].forEach(i => { $(i).value = ''; });
        $('pMulti').checked = false;
        window.togglePollForm();
        setStatus('');
      } catch (e) { console.error(e); setStatus(errText(e), true); }
      $('pollBtn').disabled = false;
    };

    // ---------- 起動 ----------
    function stopListening() { unsubs.forEach(u => u()); unsubs = []; }

    onAuthStateChanged(auth, async (user) => {
      stopListening();
      me = user || null;

      if (!user) {
        $('app').classList.add('hidden');
        $('gate').style.display = 'block';
        setStatus('');
        return;
      }

      $('gate').style.display = 'none';
      $('app').classList.remove('hidden');
      setStatus('');

      let saved = '';
      try { saved = localStorage.getItem(NAME_KEY) || ''; } catch (e) { /* ignore */ }
      if (!saved) saved = user.displayName || '';
      $('displayName').value = saved;

      if (location.hash === '#help') window.showTab('help');
      else if (location.hash === '#poll') window.showTab('poll');

      unsubs.push(onSnapshot(query(collection(db, POSTS), orderBy('createdAt', 'desc'), limit(200)),
        (snap) => { posts = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderPosts(); },
        (err) => { console.error(err); setStatus(errText(err), true); }));

      unsubs.push(onSnapshot(query(collection(db, HELPS), orderBy('createdAt', 'desc'), limit(100)),
        (snap) => { helps = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderHelps(); },
        (err) => { console.error(err); setStatus(errText(err), true); }));

      unsubs.push(onSnapshot(query(collection(db, POLLS), orderBy('createdAt', 'desc'), limit(100)),
        (snap) => { polls = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderPolls(); },
        (err) => { console.error(err); setStatus(errText(err), true); }));
    });

    // 名前入力が終わったら、後回しにしていた募集一覧の更新を反映する
    $('helpList').addEventListener('focusout', () => {
      if (helpDeferred) setTimeout(() => { if (helpDeferred) renderHelps(); }, 350);
    });
  </script>
</body>
</html>
